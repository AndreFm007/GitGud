<!DOCTYPE html>
<html>
<head>
  <title>Exemplo com Botões</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }

    h1 {
      text-align: center;
    }

    .botao {
      width: 200px;
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      color: white;
      cursor: pointer;
    }

    .botao1 {
      background-color: #007BFF; /* azul */
    }

    .botao2 {
      background-color: #28a745; /* verde */
    }

    .botao3 {
      background-color: #dc3545; /* vermelho */
    }
  </style>
</head>
<body>

  <h1>Olá!</h1>

  <button class="botao botao1" onclick="dizerOla()">Botão 1</button>
  <button class="botao botao2" onclick="alert('Botão 2 clicado!')">Botão 2</button>
  <button class="botao botao3" onclick="alert('Botão 3 clicado!')">Botão 3</button>

  <script>
    function dizerOla() {
      const nome = prompt("Qual é o teu nome?");
      alert("Olá, " + nome + "! Bem-vindo.");
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UniGitGud - Map Events & Discounts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    :root {
      --base: #1e1e2e;
      --mantle: #181825;
      --crust: #11111b;
      --text: #cdd6f4;
      --subtext: #a6adc8;
      --blue: #89b4fa;
      --lavender: #b4befe;
      --surface0: #313244;
      --surface1: #45475a;
      --surface2: #585b70;
      --green: #a6e3a1;
      --red: #f38ba8;
      --yellow: #f9e2af;
      --accent: var(--blue);
    }

    body, html {
      margin: 0;
      height: 100%;
      background: var(--mantle);
      font-family: 'Segoe UI', sans-serif;
      color: var(--text);
    }

    #map {
      height: 100%;
      width: 100%;
      z-index: 0;
    }

    .header {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2rem;
      font-weight: bold;
      color: var(--lavender);
      background: var(--surface1);
      padding: 8px 15px;
      border-radius: 10px;
      z-index: 1100;
      box-shadow: 0 2px 5px black;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      height: 30px;
      width: 30px;
      border-radius: 50%;
      object-fit: cover;
    }

    .floating-container {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      z-index: 1000;
    }

    .floating-button {
      background: var(--surface1);
      color: var(--text);
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 2px 5px black;
      width: 150px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .floating-button:hover {
      background: var(--surface2);
      transform: translateY(-2px);
    }

    .popup {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 500px;
      background: var(--surface0);
      padding: 20px;
      border-radius: 10px;
      display: none;
      z-index: 1001;
      box-shadow: 0 2px 10px black;
    }

    .popup.show {
      display: block;
    }

    h2 {
      margin-top: 0;
      color: var(--lavender);
    }

    input, select, button, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background: var(--surface1);
      color: var(--text);
    }

    ul {
      list-style: none;
      padding-left: 0;
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
    }

    ul li {
      background: var(--surface2);
      margin-bottom: 5px;
      padding: 8px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-btn {
      background: var(--red);
      color: var(--crust);
      width: auto;
      padding: 5px 10px;
      font-size: 0.9rem;
      float: right;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      background: var(--crust);
      color: var(--red);
    }

    .location-info {
      font-size: 0.9rem;
      color: var(--yellow);
      margin-top: 10px;
    }

    .user-info {
      position: fixed;
      top: 10px;
      right: 180px;
      background: var(--surface1);
      padding: 8px 15px;
      border-radius: 10px;
      z-index: 1100;
      box-shadow: 0 2px 5px black;
      font-size: 0.9rem;
    }

    .delete-btn {
      background: var(--red);
      color: var(--crust);
      width: auto;
      padding: 5px 10px;
      font-size: 0.8rem;
      margin-left: 10px;
      cursor: pointer;
      border-radius: 4px;
      border: none;
      transition: all 0.2s ease;
    }

    .delete-btn:hover {
      background: var(--crust);
      color: var(--red);
    }

    .upgrade-btn {
      background: var(--green);
      color: var(--crust);
      width: auto;
      padding: 5px 10px;
      font-size: 0.8rem;
      margin-left: 10px;
      cursor: pointer;
      border-radius: 4px;
      border: none;
      transition: all 0.2s ease;
    }

    .upgrade-btn:hover {
      background: var(--crust);
      color: var(--green);
    }

    .event-image-preview {
      max-width: 100%;
      max-height: 150px;
      margin-top: 10px;
      border-radius: 6px;
      display: none;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .event-link {
      color: var(--blue);
      text-decoration: none;
      font-size: 0.9rem;
      word-break: break-all;
    }

    .event-link:hover {
      text-decoration: underline;
    }

    .event-details {
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--subtext);
    }

    .edit-btn {
      background: var(--yellow);
      color: var(--crust);
      width: auto;
      padding: 5px 10px;
      font-size: 0.8rem;
      margin-left: 10px;
      cursor: pointer;
      border-radius: 4px;
      border: none;
      transition: all 0.2s ease;
    }
    
    .edit-btn:hover {
      background: var(--crust);
      color: var(--yellow);
    }
    
    .filter-container {
      margin-bottom: 15px;
    }
    
    .search-input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: var(--surface1);
      color: var(--text);
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .button-group button {
      flex: 1;
    }
  </style>
</head>

<body>

<div id="map"></div>

<div class="header">
  <img src="https://via.placeholder.com/30" class="logo">
  UniGitGud
</div>

<div class="user-info" id="userInfo">
  <span id="userStatus">Logged in as Student (Read Only)</span>
  <button class="upgrade-btn" id="upgradeBtn" onclick="upgradeToHost()">Upgrade to Host</button>
</div>

<div class="floating-container">
  <button class="floating-button" onclick="togglePopup('calendarPopup')">📅 Calendar</button>
  <button class="floating-button" onclick="togglePopup('storePopup')">🏬 Stores</button>
  <button class="floating-button" id="logoutBtn" style="display:none;" onclick="logout()">🔒 Logout</button>
</div>

<!-- Calendar Popup -->
<div class="popup" id="calendarPopup">
  <button class="close-btn" onclick="togglePopup('calendarPopup')">✖</button>
  <h2>Calendar</h2>
  <div class="filter-container">
    <input type="text" id="eventSearch" class="search-input" placeholder="Search events by description..." oninput="filterEvents()">
  </div>
  <div id="eventForm" style="display: none;">
    <input type="hidden" id="editingEventId">
    <div class="form-group">
      <input type="date" id="eventDate" min="">
    </div>
    <div class="form-group">
      <input type="text" id="eventTitle" placeholder="Event title">
    </div>
    <div class="form-group">
      <textarea id="eventDescription" placeholder="Event description"></textarea>
    </div>
    <div class="form-group">
      <input type="text" id="eventLink" placeholder="Event website URL (optional)">
    </div>
    <div class="form-group">
      <input type="file" id="eventImage" accept="image/*" onchange="previewImage()">
      <img id="eventImagePreview" class="event-image-preview">
    </div>
    <div class="location-info" id="locationInfo">Click the map to select a location</div>
    <div class="button-group">
      <button onclick="saveEvent()" id="saveEventBtn">Add Event</button>
      <button class="delete-btn" onclick="cancelEdit()" id="cancelEditBtn" style="display:none;">Cancel</button>
    </div>
  </div>
  <ul id="eventList"></ul>
</div>

<!-- Store Popup -->
<div class="popup" id="storePopup">
  <button class="close-btn" onclick="togglePopup('storePopup')">✖</button>
  <h2>Nearby Stores</h2>
  <select id="discountFilter" onchange="filterStores()">
    <option value="0">Show All</option>
    <option value="10">10% or more</option>
    <option value="20">20% or more</option>
    <option value="30">30% or more</option>
  </select>
  <ul id="storeList"></ul>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
let map = L.map('map').setView([0, 0], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// Set minimum date for event input
document.getElementById('eventDate').min = new Date().toISOString().split('T')[0];

// User location
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    map.setView([lat, lon], 15);
    L.marker([lat, lon]).addTo(map).bindPopup('You are here!').openPopup();
    generateStores(lat, lon);
    loadEvents();
    removePastEvents(); // Remove past events on load
  });
} else {
  alert("Geolocation not supported!");
}

function togglePopup(id) {
  document.getElementById(id).classList.toggle('show');
}

// Authentication System
let currentUser = { type: 'student', name: 'Student' };
const validHosts = {
  "admin": "admin123",
  "event_team": "events2023",
  "university": "campus456",
  "john_doe": "doe789",
  "jane_smith": "smith321"
};

function upgradeToHost() {
  const hostName = prompt("Enter your host name:");
  const hostKey = prompt("Enter your host key:");
  
  if (hostName && hostKey && validHosts[hostName] === hostKey) {
    currentUser = { 
      type: 'host', 
      name: hostName,
      key: hostKey
    };
    document.getElementById('userStatus').textContent = `Logged in as Host: ${hostName}`;
    document.getElementById('eventForm').style.display = 'block';
    document.getElementById('upgradeBtn').style.display = 'none';
    document.getElementById('logoutBtn').style.display = 'block';
    renderEvents();
  } else {
    alert("Invalid host credentials!");
  }
}

function logout() {
  currentUser = { type: 'student', name: 'Student' };
  document.getElementById('userStatus').textContent = 'Logged in as Student (Read Only)';
  document.getElementById('eventForm').style.display = 'none';
  document.getElementById('upgradeBtn').style.display = 'block';
  document.getElementById('logoutBtn').style.display = 'none';
  renderEvents();
}

// Calendar Events
let events = [];
let selectedLocation = null;
let tempMarker = null;
let eventImageData = null;

function previewImage() {
  const file = document.getElementById('eventImage').files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const preview = document.getElementById('eventImagePreview');
      preview.src = e.target.result;
      preview.style.display = 'block';
      eventImageData = e.target.result; // Store base64 image data
    };
    reader.readAsDataURL(file);
  }
}

map.on('click', function(e) {
  if (currentUser && currentUser.type === 'host') {
    selectedLocation = e.latlng;
    document.getElementById('locationInfo').textContent = `Selected: (${selectedLocation.lat.toFixed(4)}, ${selectedLocation.lng.toFixed(4)})`;

    if (tempMarker) {
      map.removeLayer(tempMarker);
    }
    tempMarker = L.marker(selectedLocation, {icon: redIcon()}).addTo(map).bindPopup('Event location').openPopup();
  }
});

function redIcon() {
  return new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.3.1/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
  });
}

// Check if date is in the past
function isPastDate(dateString) {
  const today = new Date();
  today.setHours(0, 0, 0, 0); // Reset time to compare only dates
  const eventDate = new Date(dateString);
  return eventDate < today;
}

// Remove past events automatically
function removePastEvents() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  
  events = events.filter(event => {
    const eventDate = new Date(event.date);
    if (eventDate < today) {
      map.removeLayer(event.marker); // Remove marker from map
      return false; // Remove event from array
    }
    return true; // Keep event in array
  });
  
  saveEvents(); // Update localStorage
  renderEvents();
}

// Save events to localStorage
function saveEvents() {
  const eventsToSave = events.map(event => ({
    date: event.date,
    title: event.title,
    description: event.description,
    link: event.link,
    image: event.image,
    lat: event.marker.getLatLng().lat,
    lng: event.marker.getLatLng().lng,
    hostName: event.hostName,
    id: event.id
  }));
  localStorage.setItem('savedEvents', JSON.stringify(eventsToSave));
}

// Load events from localStorage
function loadEvents() {
  const savedEvents = localStorage.getItem('savedEvents');
  if (savedEvents) {
    const parsedEvents = JSON.parse(savedEvents);
    parsedEvents.forEach(eventData => {
      // Skip if event date is in the past
      if (isPastDate(eventData.date)) return;
      
      let popupContent = `<b>${eventData.title}</b><br>${eventData.date}<br>Host: ${eventData.hostName}`;
      if (eventData.description) popupContent += `<br><br>${eventData.description}`;
      if (eventData.link) popupContent += `<br><br><a href="${eventData.link}" target="_blank">Event Website</a>`;
      if (eventData.image) popupContent += `<br><img src="${eventData.image}" style="max-width:200px;max-height:150px;margin-top:10px;">`;
      
      let eventMarker = L.marker([eventData.lat, eventData.lng], {icon: redIcon()})
        .addTo(map)
        .bindPopup(popupContent);
      
      const event = {
        date: eventData.date, 
        title: eventData.title,
        description: eventData.description,
        link: eventData.link,
        image: eventData.image,
        marker: eventMarker,
        hostName: eventData.hostName,
        id: eventData.id
      };
      
      events.push(event);
    });
    renderEvents();
  }
}

function editEvent(eventId) {
  const event = events.find(e => e.id === eventId);
  if (event && currentUser.type === 'host' && currentUser.name === event.hostName) {
    document.getElementById('editingEventId').value = eventId;
    document.getElementById('eventDate').value = event.date;
    document.getElementById('eventTitle').value = event.title;
    document.getElementById('eventDescription').value = event.description || '';
    document.getElementById('eventLink').value = event.link || '';
    
    // Handle image
    const preview = document.getElementById('eventImagePreview');
    if (event.image) {
      preview.src = event.image;
      preview.style.display = 'block';
      eventImageData = event.image;
    } else {
      preview.style.display = 'none';
      eventImageData = null;
    }
    
    // Set location
    selectedLocation = event.marker.getLatLng();
    document.getElementById('locationInfo').textContent = 
      `Selected: (${selectedLocation.lat.toFixed(4)}, ${selectedLocation.lng.toFixed(4)})`;
    
    if (tempMarker) {
      map.removeLayer(tempMarker);
    }
    tempMarker = L.marker(selectedLocation, {icon: redIcon()}).addTo(map).bindPopup('Event location').openPopup();
    
    // Update button text and show cancel button
    document.getElementById('saveEventBtn').textContent = 'Update Event';
    document.getElementById('cancelEditBtn').style.display = 'block';
  } else {
    alert('You can only edit your own events!');
  }
}

function cancelEdit() {
  // Reset form
  document.getElementById('editingEventId').value = '';
  document.getElementById('eventDate').value = '';
  document.getElementById('eventTitle').value = '';
  document.getElementById('eventDescription').value = '';
  document.getElementById('eventLink').value = '';
  document.getElementById('eventImage').value = '';
  document.getElementById('eventImagePreview').style.display = 'none';
  eventImageData = null;
  selectedLocation = null;
  document.getElementById('locationInfo').textContent = 'Click the map to select a location';
  
  if (tempMarker) {
    map.removeLayer(tempMarker);
    tempMarker = null;
  }
  
  // Reset button text and hide cancel button
  document.getElementById('saveEventBtn').textContent = 'Add Event';
  document.getElementById('cancelEditBtn').style.display = 'none';
}

function saveEvent() {
  const editingEventId = document.getElementById('editingEventId').value;
  
  if (editingEventId) {
    updateEvent(editingEventId);
  } else {
    addEvent();
  }
}

function updateEvent(eventId) {
  if (currentUser && currentUser.type === 'host') {
    const date = document.getElementById('eventDate').value;
    const title = document.getElementById('eventTitle').value.trim();
    const description = document.getElementById('eventDescription').value.trim();
    const link = document.getElementById('eventLink').value.trim();
    
    if (!date || !title || !selectedLocation) {
      alert('Please select date, title and a location!');
      return;
    }
    
    if (isPastDate(date)) {
      alert('Cannot create events in the past! Please select a current or future date.');
      return;
    }
    
    const eventIndex = events.findIndex(e => e.id == eventId);
    if (eventIndex !== -1 && events[eventIndex].hostName === currentUser.name) {
      // Remove old marker
      map.removeLayer(events[eventIndex].marker);
      
      // Create new popup content
      let popupContent = `<b>${title}</b><br>${date}<br>Host: ${currentUser.name}`;
      if (description) popupContent += `<br><br>${description}`;
      if (link) popupContent += `<br><br><a href="${link}" target="_blank">Event Website</a>`;
      if (eventImageData) popupContent += `<br><img src="${eventImageData}" style="max-width:200px;max-height:150px;margin-top:10px;">`;
      
      // Create new marker
      let eventMarker = L.marker([selectedLocation.lat, selectedLocation.lng], {icon: redIcon()})
        .addTo(map)
        .bindPopup(popupContent);
      
      // Update event
      events[eventIndex] = {
        date, 
        title,
        description,
        link,
        image: eventImageData,
        marker: eventMarker,
        hostName: currentUser.name,
        id: eventId
      };
      
      saveEvents();
      renderEvents();
      cancelEdit();
    } else {
      alert('You can only edit your own events!');
    }
  }
}

function addEvent() {
  if (currentUser && currentUser.type === 'host') {
    const date = document.getElementById('eventDate').value;
    const title = document.getElementById('eventTitle').value.trim();
    const description = document.getElementById('eventDescription').value.trim();
    const link = document.getElementById('eventLink').value.trim();
    
    if (!date || !title || !selectedLocation) {
      alert('Please select date, title and a location!');
      return;
    }
    
    if (isPastDate(date)) {
      alert('Cannot create events in the past! Please select a current or future date.');
      return;
    }
    
    let popupContent = `<b>${title}</b><br>${date}<br>Host: ${currentUser.name}`;
    if (description) popupContent += `<br><br>${description}`;
    if (link) popupContent += `<br><br><a href="${link}" target="_blank">Event Website</a>`;
    if (eventImageData) popupContent += `<br><img src="${eventImageData}" style="max-width:200px;max-height:150px;margin-top:10px;">`;
    
    let eventMarker = L.marker([selectedLocation.lat, selectedLocation.lng], {icon: redIcon()})
      .addTo(map)
      .bindPopup(popupContent);
    
    const event = {
      date, 
      title,
      description,
      link,
      image: eventImageData,
      marker: eventMarker,
      hostName: currentUser.name,
      id: Date.now()
    };
    
    events.push(event);
    saveEvents();
    renderEvents();
    
    // Reset form
    document.getElementById('eventDate').value = '';
    document.getElementById('eventTitle').value = '';
    document.getElementById('eventDescription').value = '';
    document.getElementById('eventLink').value = '';
    document.getElementById('eventImage').value = '';
    document.getElementById('eventImagePreview').style.display = 'none';
    eventImageData = null;
    selectedLocation = null;
    document.getElementById('locationInfo').textContent = 'Click the map to select a location';
    if (tempMarker) {
      map.removeLayer(tempMarker);
      tempMarker = null;
    }
  }
}

function deleteEvent(eventId) {
  if (currentUser && currentUser.type === 'host') {
    const eventIndex = events.findIndex(e => e.id === eventId);
    if (eventIndex !== -1) {
      if (events[eventIndex].hostName === currentUser.name) {
        map.removeLayer(events[eventIndex].marker);
        events.splice(eventIndex, 1);
        saveEvents();
        renderEvents();
      } else {
        alert('You can only delete your own events!');
      }
    }
  }
}

function filterEvents() {
  const searchTerm = document.getElementById('eventSearch').value.toLowerCase();
  const list = document.getElementById('eventList');
  list.innerHTML = '';
  
  const sortedEvents = [...events].sort((a, b) => new Date(a.date) - new Date(b.date));
  
  sortedEvents.forEach(ev => {
    // Skip if doesn't match search (when search term exists)
    if (searchTerm && 
        (!ev.description || !ev.description.toLowerCase().includes(searchTerm))) {
      return;
    }
    
    const li = document.createElement('li');
    
    const eventContent = document.createElement('div');
    eventContent.innerHTML = `<strong>${ev.date}: ${ev.title}</strong> (Host: ${ev.hostName})`;
    
    if (ev.description || ev.link) {
      const details = document.createElement('div');
      details.className = 'event-details';
      if (ev.description) details.innerHTML += `<div>${ev.description}</div>`;
      if (ev.link) details.innerHTML += `<a href="${ev.link}" class="event-link" target="_blank">${ev.link}</a>`;
      eventContent.appendChild(details);
    }
    
    li.appendChild(eventContent);
    
    if (currentUser && currentUser.type === 'host' && currentUser.name === ev.hostName) {
      const editBtn = document.createElement('button');
      editBtn.className = 'edit-btn';
      editBtn.textContent = 'Edit';
      editBtn.onclick = (e) => {
        e.stopPropagation();
        editEvent(ev.id);
      };
      li.appendChild(editBtn);
      
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = 'Delete';
      deleteBtn.onclick = (e) => {
        e.stopPropagation();
        deleteEvent(ev.id);
      };
      li.appendChild(deleteBtn);
    }
    
    list.appendChild(li);
  });
}

function renderEvents() {
  filterEvents(); // Just use the filter function which now handles rendering
}

// Store Management
const exampleStores = [
  "Tech Haven", "Gadget World", "Fashion Hub", "Home Comforts",
  "Pet Paradise", "Book Nook", "Sporty Life", "Beauty Bliss"
];

let stores = [];
let storeMarkers = [];

function generateStores(lat, lon) {
  for (let i = 0; i < exampleStores.length; i++) {
    let offsetLat = lat + (Math.random() - 0.5) * 0.01;
    let offsetLon = lon + (Math.random() - 0.5) * 0.01;
    let discount = Math.floor(Math.random() * 41); // 0-40%

    let store = {
      name: exampleStores[i],
      lat: offsetLat,
      lon: offsetLon,
      discount: discount
    };

    stores.push(store);

    const marker = L.marker([offsetLat, offsetLon])
      .addTo(map)
      .bindPopup(`<b>${store.name}</b><br>${store.discount}% discount`);
    
    storeMarkers.push({marker: marker, store: store});
  }

  renderStoreList();
}

function renderStoreList(minDiscount = 0) {
  const list = document.getElementById('storeList');
  list.innerHTML = '';

  storeMarkers.forEach(({marker, store}) => {
    if (store.discount >= minDiscount) {
      const li = document.createElement('li');
      li.innerHTML = `<b>${store.name}</b> - ${store.discount}% off`;
      list.appendChild(li);
      marker.addTo(map);
    } else {
      map.removeLayer(marker);
    }
  });
}

function filterStores() {
  const minDiscount = parseInt(document.getElementById('discountFilter').value);
  renderStoreList(minDiscount);
}

// Initialize date input with current date as minimum
document.addEventListener('DOMContentLoaded', function() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('eventDate').min = today;
});
</script>
